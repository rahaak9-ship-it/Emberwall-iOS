workflows:
  emberwall-ios:
    name: Emberwall - signed iOS IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: "26.6"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.rahaa.emberwall
      vars:
        APPLE_TEAM_ID: "PWC93S9KK8"
        EMBERWALL_BUNDLE_ID: "com.rahaa.emberwall"
    scripts:
      - name: Unpack the Emberwall source archive
        script: |
          cd "$CM_BUILD_DIR"
          unzip -q emberwall-source.zip -d .
          test -f project.godot
          test -f ci/install_godot.sh
      - name: Install Godot 4.7.2 and iOS export template
        script: bash ci/install_godot.sh
      - name: Export the iOS Xcode project
        script: bash ci/export_ios.sh
      - name: Build a signed archive
        script: bash ci/archive_ios.sh
      - name: Export the signed IPA
        script: bash ci/export_ipa.sh
    artifacts:
      - build/ipa/*.ipa
      - build/*.log
  emberwall-unsigned:
    name: Emberwall - unsigned macOS compile check
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: "26.6"
      vars:
        APPLE_TEAM_ID: "PWC93S9KK8"
        EMBERWALL_BUNDLE_ID: "com.rahaa.emberwall"
    scripts:
      - name: Unpack the Emberwall source archive
        script: |
          cd "$CM_BUILD_DIR"
          unzip -q emberwall-source.zip -d .
          test -f project.godot
          test -f ci/install_godot.sh
      - name: Install Godot 4.7.2 and iOS export template
        script: bash ci/install_godot.sh
      - name: Export the iOS Xcode project
        script: bash ci/export_ios.sh
      - name: Archive without signing to verify the native build
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          xcodebuild \
            -project build/ios/Emberwall.xcodeproj \
            -scheme Emberwall \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/Emberwall-unsigned.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build/xcodebuild-unsigned.log
          cd build
          ditto -c -k --sequesterRsrc --keepParent Emberwall-unsigned.xcarchive Emberwall-unsigned.xcarchive.zip
          ls -lh Emberwall-unsigned.xcarchive.zip
    artifacts:
      - build/Emberwall-unsigned.xcarchive.zip
      - build/*.log

  emberwall-android:
    name: Emberwall - Android debug APK
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      java: 17
      vars:
        GODOT_VERSION: "4.7.2"
    scripts:
      - name: Unpack the Emberwall source archive
        script: |
          cd "$CM_BUILD_DIR"
          unzip -q emberwall-source.zip -d .
          test -f project.godot
      - name: Install Godot Linux and the Android template
        script: |
          set -euo pipefail
          ROOT="$CM_BUILD_DIR"
          TOOLS="$ROOT/ci-tools"
          mkdir -p "$TOOLS"
          curl -fL --retry 3 -o "$TOOLS/godot-mac.zip" "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip"
          rm -rf "$TOOLS/godot-mac"
          mkdir -p "$TOOLS/godot-mac"
          unzip -q "$TOOLS/godot-mac.zip" -d "$TOOLS/godot-mac"
          GODOT_BIN="$(find "$TOOLS/godot-mac" -type f -path '*/Godot.app/Contents/MacOS/Godot' | head -n 1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$CM_ENV"
          curl -fL --retry 3 -o "$TOOLS/templates.tpz" "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPLATE_DIR"
          unzip -p "$TOOLS/templates.tpz" templates/android_debug.apk > "$TEMPLATE_DIR/android_debug.apk"
          unzip -p "$TOOLS/templates.tpz" templates/android_release.apk > "$TEMPLATE_DIR/android_release.apk"
          unzip -p "$TOOLS/templates.tpz" templates/version.txt > "$TEMPLATE_DIR/version.txt"
          test -s "$TEMPLATE_DIR/android_debug.apk"
          ls -lh "$TEMPLATE_DIR"
          if [ -z "${ANDROID_HOME:-}" ]; then
            for candidate in "${ANDROID_SDK_ROOT:-}" "/usr/local/lib/android/sdk" "$HOME/Library/Android/sdk" "/Users/builder/Library/Android/sdk" "/usr/local/share/android-sdk" "/opt/homebrew/share/android-sdk" "$HOME/Android/Sdk" "$HOME/android-sdk"; do
              if [ -n "$candidate" ] && [ -d "$candidate" ]; then export ANDROID_HOME="$candidate"; break; fi
            done
          fi
          test -n "${ANDROID_HOME:-}"
          if [ -x /usr/libexec/java_home ]; then export JAVA_HOME="$(/usr/libexec/java_home -v 17)"; echo "JAVA_HOME=$JAVA_HOME" >> "$CM_ENV"; fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$CM_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$CM_ENV"
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | tail -n 3 || true
      - name: Write the Android export preset
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          rm -f export_presets.cfg
          cat > export_presets.cfg <<'PRESET'
          [preset.0]
          name="Android Debug"
          platform="Android"
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter="tests/*, tools/*, previews/*, build/*, ci/*, codemagic.yaml"
          export_path="build/android/Emberwall-debug.apk"
          patches=PackedStringArray()
          encryption_include_filters=""
          encryption_exclude_filters=""
          seed=0
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2
          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/gradle_build_directory=""
          gradle_build/android_source_template=""
          gradle_build/compress_native_libraries=false
          gradle_build/export_format=0
          gradle_build/min_sdk=""
          gradle_build/target_sdk=""
          gradle_build/custom_theme_attributes={}
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="0.1.0"
          package/unique_name="com.rahaa.emberwall"
          package/name="Emberwall"
          package/signed=true
          package/app_category=2
          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false
          package/show_in_android_tv=false
          package/show_in_app_library=true
          package/show_as_launcher_app=false
          launcher_icons/main_192x192="res://assets/branding/icon_512.png"
          launcher_icons/adaptive_foreground_432x432="res://assets/branding/icon_512.png"
          launcher_icons/adaptive_background_432x432=""
          launcher_icons/adaptive_monochrome_432x432=""
          graphics/opengl_debug=false
          shader_baker/enabled=false
          xr_features/xr_mode=0
          gesture/swipe_to_dismiss=false
          screen/immersive_mode=true
          screen/edge_to_edge=false
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          screen/background_color=Color(0.027, 0.039, 0.09, 1)
          splash_screen/disable_godot_boot_splash=false
          splash_screen/icon=""
          splash_screen/branding_image=""
          splash_screen/background_color=Color(0.027, 0.039, 0.09, 1)
          user_data_backup/allow=false
          command_line/extra_args=""
          permissions/custom_permissions=PackedStringArray()
          PRESET
          echo "--- preset head ---"
          head -n 6 export_presets.cfg
          grep -c "Android Debug" export_presets.cfg
      - name: Export the debug APK
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p build/android
          "$GODOT_BIN" --headless --path "$CM_BUILD_DIR" --export-debug "Android Debug" "build/android/Emberwall-debug.apk" 2>&1 | tee build/android-export.log
          test -s build/android/Emberwall-debug.apk
          ls -lh build/android/Emberwall-debug.apk
    artifacts:
      - build/android/*.apk
      - build/*.log


